<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ثبت نام | فودینو</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header"><div class="container nav">
  <a href="index.html" class="logo"> <span>فودینو</span></a>
  <nav class="main-nav"><a href="index.html">خانه</a><a href="menu.html">منوی غذا</a><a href="about.html">درباره ما</a><a href="contact.html">تماس با ما</a></nav>
  <div class="nav-buttons"><a href="cart.html" class="cart-btn">🛒 سبد <span id="cart-count">0</span></a></div>
</div></header>

<main class="auth-section">
  <div class="auth-box wide">
    <div class="auth-icon">👤</div><h1>ساخت حساب کاربری</h1><p>اطلاعات خود را وارد کنید.</p>
    <form id="register-form" class="form-grid">
      <div><label for="reg-name">نام و نام خانوادگی</label><input id="reg-name" type="text" required></div>
      <div><label for="reg-email">ایمیل</label><input id="reg-email" type="email" required></div>
      <div><label for="reg-phone">شماره موبایل</label><input id="reg-phone" type="tel" required></div>
      <div><label for="reg-password">رمز عبور</label><input id="reg-password" type="password" minlength="4" required></div>
      <div><label for="reg-confirm">تکرار رمز عبور</label><input id="reg-confirm" type="password" minlength="4" required></div>
      <div class="full-field"><label for="reg-address">آدرس</label><textarea id="reg-address" rows="3" required></textarea></div>
      <button class="primary-btn full-btn full-field" type="submit">ثبت نام</button>
    </form>
    <p class="auth-link">قبلاً ثبت نام کرده‌اید؟ <a href="login.html">ورود</a></p>
  </div>
</main>
<script src="js/script.js"></script>
</body>
</html>
